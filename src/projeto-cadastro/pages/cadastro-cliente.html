<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D6 - Cadastro de Cliente</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="header">
        <img src="../assets/logo.png" alt="D6 Arquitetura" class="logo">
    </header>

    <main class="container">
        <h2>Cadastro de Cliente</h2>
        
        <form id="form-cliente" class="form-card">
            
            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" required>
            </div>
            
            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="telefone">Telefone:</label>
                <input type="text" id="telefone" name="telefone">
            </div>
            
            <div class="form-group">
                <label for="documento">CNPJ ou CPF:</label>
                <input type="text" id="documento" name="documento" required> 
            </div>
            
            <div class="button-group">
                <button type="submit" class="btn btn-primary">Cadastrar Cliente</button>
                <button type="reset" class="btn btn-secondary">Limpar</button>
                <a href="../index.html" class="btn btn-secondary">Voltar ao Menu</a>
            </div>

        </form>
    </main>

    <script src="../js/validation.js"></script>
    <script src="../js/app.js"></script> 
</body>
</html>
