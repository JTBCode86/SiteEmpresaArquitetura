<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D6 - Cadastro de Fornecedor</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="header">
        <img src="../assets/logo.png" alt="D6 Arquitetura" class="logo">
    </header>

    <main class="container">
        <h2>Cadastro de Fornecedor</h2>
        
        <form id="form-fornecedor" class="form-card">
            
            <div class="form-group">
                <label for="razaoSocial">Razão Social:</label>
                <input type="text" id="razaoSocial" name="razaoSocial" required>
            </div>
            
            <div class="form-group">
                <label for="cnpj">CNPJ:</label>
                <input type="text" id="cnpj" name="cnpj" required>
            </div>
            
            <div class="form-group">
                <label for="contato">Nome do Contato:</label>
                <input type="text" id="contato" name="contato" required>
            </div>
            
            <div class="form-group">
                <label for="produtoPrincipal">Produto Principal Fornecido:</label>
                <input type="text" id="produtoPrincipal" name="produtoPrincipal">
            </div>
            
            <div class="button-group">
                <button type="submit" class="btn btn-primary">Cadastrar Fornecedor</button>
                <button type="reset" class="btn btn-secondary">Limpar</button>
                <a href="../index.html" class="btn btn-secondary">Voltar ao Menu</a>
            </div>

        </form>
    </main>

    <script src="../js/validation.js"></script>
    <script src="../js/app.js"></script>
</body>
</html>
